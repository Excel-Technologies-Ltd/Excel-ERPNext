name: Frappe Docker Build Dev Excel ERPNext

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "version-14"
        type: string

env:
  REGISTRY: registry.aninda.me
  HARBOR_PROJECT: arcapps
  BASE_REGISTRY: registry.aninda.me/dockerhub/library
  TAG: 'latest'        

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: Excel-Technologies-Ltd/excel-frappe-docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: login to harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Pull base image through Harbor proxy
        run: |
          sed -i "s|^FROM python:|FROM ${BASE_REGISTRY}/python:|" images/custom/Containerfile
          grep -n "^FROM" images/custom/Containerfile

      - name: Build and Push Frappe Docker Image
        run: |
          export APPS_JSON='[
            {"url": "https://github.com/frappe/erpnext", "branch": "v14.60.1"},
            {"url": "https://github.com/frappe/hrms.git", "branch": "v14.21.0"},
            {"url": "https://gitlab.com/excel.azmin/whitelabel.git", "branch": "main"},
            {"url": "https://github.com/Excel-Technologies-Ltd/Excel-ERPNext.git", "branch": "version-14"}
          ]
          '

          export APPS_JSON_BASE64=$(echo ${APPS_JSON} | base64 -w 0)

          docker buildx build \
          --no-cache \
          --platform linux/amd64 \
          --build-arg FRAPPE_PATH=https://github.com/frappe/frappe \
          --build-arg FRAPPE_BRANCH=v14.64.0 \
          --build-arg PYTHON_VERSION=3.11.9 \
          --build-arg NODE_VERSION=20.19.2  \
          --build-arg APPS_JSON_BASE64="$APPS_JSON_BASE64" \
          --tag ${REGISTRY}/${HARBOR_PROJECT}/erpnext-v14:latest \
          --file images/custom/Containerfile \
          --push .
